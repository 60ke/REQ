[package]
name = "req"
version = "0.1.0"
description = "A local-first, open-source API workspace"
authors = ["Req contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "req_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "req"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
tauri = { version = "2", optional = true , features = [] }
tempfile = "3"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "net", "io-util"] }
tokio-util = "0.7"
url = "2"

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
